<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Omani Seaweed Database</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f1f5f6;--sf:#fff;--ink:#112027;--ink2:#46585f;--mu:#6d8088;--ln:#d9e2e5;--ac:#a3245a;--acs:#f7e4ec;--ok:#11733a;--wn:#946000;--cr:#b8342b;--c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c6:#7a8c2a;--c7:#6250d6;--c8:#e34948;--sea:#dbe9ed;--land:#fbfcfb;--f:"Inter","Cairo",system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0c1519;--sf:#142229;--ink:#e3ebed;--ink2:#a6b6bc;--mu:#7f9299;--ln:#263a43;--ac:#e8719f;--acs:#3a1c29;--ok:#45c46d;--wn:#e5a83a;--cr:#f07164;--sea:#0f2730;--land:#1d313a;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0c1519;--sf:#142229;--ink:#e3ebed;--ink2:#a6b6bc;--mu:#7f9299;--ln:#263a43;--ac:#e8719f;--acs:#3a1c29;--ok:#45c46d;--wn:#e5a83a;--cr:#f07164;--sea:#0f2730;--land:#1d313a;color-scheme:dark}
html,body{height:100%}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--f)}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100%}
aside{background:var(--sf);border-inline-end:1px solid var(--ln);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{font-weight:700;font-size:17px;display:flex;gap:8px;align-items:center;margin-bottom:4px}.logo b{color:var(--ac)}.sub{font-size:11px;color:var(--mu);margin-bottom:16px}
nav button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:9px 10px;border-radius:8px;text-align:start;color:var(--ink2);font-weight:500}
nav button:hover{background:var(--bg)}nav button.on{background:var(--acs);color:var(--ac);font-weight:600}
.tools{display:flex;gap:6px;margin-top:14px}.tools button{flex:1;border:1px solid var(--ln);background:var(--bg);border-radius:8px;padding:7px}
main{padding:20px clamp(14px,3vw,32px);min-width:0}
h1{font-size:22px;margin:0 0 2px}h2{font-size:15px;margin:0 0 10px}.mu{color:var(--mu)}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.srch{flex:1 1 240px;max-width:360px;padding:9px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--sf)}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:14px;min-width:0}

.bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12.5px;cursor:pointer}.bar>span:first-child{width:36%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar i{display:block;height:10px;border-radius:5px;background:var(--ac);min-width:3px;transition:width .5s}.bar em{font-style:normal;color:var(--mu);font-size:12px}
.tr{flex:1;background:var(--bg);border-radius:5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.chip{border:1px solid var(--ln);background:var(--sf);border-radius:99px;padding:4px 11px;font-size:12.5px}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
select{padding:6px 8px;border:1px solid var(--ln);border-radius:8px;background:var(--sf)}

.sc{overflow-x:auto}.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11.5px;background:var(--acs);color:var(--ac);font-weight:600}.tag.ok{background:#e1f1e6;color:#11733a}.tag.wn{background:#fbeed2;color:#946000}.tag.cr{background:#f8e1de;color:#b8342b}
.sp{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.sp .card{cursor:pointer;transition:transform .15s,box-shadow .15s}.sp .card:hover{transform:translateY(-2px);box-shadow:0 8px 20px -10px rgba(0,0,0,.4)}
.sp i.bn{font-style:italic;font-weight:600}
svg text{font-family:var(--f)}
.map{width:100%;height:auto;background:var(--sea);border-radius:10px}.dot{cursor:pointer;transition:r .15s}.dot:hover{stroke:var(--ink);stroke-width:2}
.dr{position:fixed;inset-block:0;inset-inline-end:0;width:min(440px,100%);background:var(--sf);border-inline-start:1px solid var(--ln);box-shadow:-10px 0 30px -12px rgba(0,0,0,.4);z-index:40;overflow:auto;padding:18px;animation:in .2s}
@keyframes in{from{transform:translateX(30px);opacity:0}}[dir=rtl] .dr{animation-name:inr}@keyframes inr{from{transform:translateX(-30px);opacity:0}}
.x{float:inline-end;border:0;background:var(--bg);border-radius:8px;padding:4px 10px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:13px;margin:10px 0}.kv dt{color:var(--mu)}.kv dd{margin:0}
.seq{font:11px/1.5 ui-monospace,monospace;word-break:break-all;background:var(--bg);padding:8px;border-radius:8px}
.chat{position:fixed;inset-block-end:16px;inset-inline-end:16px;z-index:30}
.fab{width:54px;height:54px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:22px;box-shadow:0 8px 20px -6px rgba(0,0,0,.5)}
.cb{width:min(380px,calc(100vw - 24px));height:min(540px,75vh);background:var(--sf);border:1px solid var(--ln);border-radius:14px;display:flex;flex-direction:column;box-shadow:0 14px 40px -12px rgba(0,0,0,.5);overflow:hidden}
.cbh{background:var(--ac);color:#fff;padding:10px 14px;font-weight:600;display:flex;justify-content:space-between}.cbh button{background:none;border:0;color:#fff;font-size:18px}
.msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}.m{max-width:88%;padding:8px 11px;border-radius:12px;background:var(--bg);white-space:pre-wrap}.m.u{align-self:flex-end;background:var(--ac);color:#fff}
.sg{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 8px}.sg button{font-size:12px;border:1px solid var(--ln);background:var(--sf);border-radius:99px;padding:3px 10px}
.cin{display:flex;gap:6px;padding:10px;border-top:1px solid var(--ln)}.cin input{flex:1;border:1px solid var(--ln);border-radius:10px;padding:8px 10px;background:var(--bg)}.cin button{border:0;background:var(--ac);color:#fff;border-radius:10px;padding:0 14px}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);padding:5px 9px;border-radius:7px;font-size:12px;z-index:50}
.nb{display:none}
@media(max-width:760px){.app{grid-template-columns:1fr}aside{position:static;height:auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center}nav{display:flex;overflow:auto;flex:1 1 100%}nav button{width:auto;white-space:nowrap}.sub{display:none}.tools{margin:0}}
</style></head><body><div class="app"><aside><div class="logo"><span style="font-size:22px">🌿</span><span id="lg"></span></div><div class="sub" id="sb"></div><nav id="nav"></nav><div class="tools"><button id="bl">عربي</button><button id="bt">◐</button></div></aside><main id="v"></main></div><div class="chat" id="chat"></div><div class="tip" id="tip" hidden></div><div id="dr"></div>

function map(v){const gs=[...new Set(D.sites.map(s=>s.gov))];v.innerHTML=head(t('map'))+`<div class="chips" id="mc"><button class="chip ${!F.sp?'on':''}" data-s="">${t('all')}</button>${SP.map(s=>`<button class="chip ${F.sp===s.code?'on':''}" data-s="${s.code}" style="${F.sp===s.code?'':'border-color:'+col(SC[s.code].i)}">L. ${s.epithet}</button>`).join('')}</div><div class="card"><svg class="map" viewBox="0 0 ${M.W} ${M.H}">${Object.values(M.paths).map(p=>`<path d="${p}" fill="var(--land)" stroke="var(--mu)" stroke-width="1.2"/>`).join('')}${D.sites.map(s=>{const rs=R.filter(r=>r.site===s.id&&(!F.sp||r.sp===F.sp));if(!rs.length)return'';const x=(s.lon-M.LON0)*M.C*M.K,y=(M.LAT0-s.lat)*M.K;return `<circle class="dot" data-s="${s.id}" cx="${x}" cy="${y}" r="${7+Math.sqrt(rs.length)*3}" fill="var(--ac)" fill-opacity=".6" stroke="var(--ac)"/>`}).join('')}</svg></div><p class="mu">${t('sortn').replace(/.*/,'')}</p>`;
v.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{F.sp=c.dataset.s;map(v)});const tip=$('#tip');v.querySelectorAll('.dot').forEach(d=>{const s=ST[d.dataset.s],n=R.filter(r=>r.site===s.id&&(!F.sp||r.sp===F.sp)).length;d.onmousemove=e=>{tip.hidden=false;tip.style.left=e.clientX+12+'px';tip.style.top=e.clientY+12+'px';tip.textContent=s.name+' · '+tv('gov',s.gov)+' · '+nf(n)};d.onmouseleave=()=>tip.hidden=true;d.onclick=()=>{F.sp=F.sp;F.q=s.name;view='rec';shell();render()}})}
const rows=()=>{const f=filt().sort((a,b)=>{const g=x=>sort[0]==='sp'?SC[x.sp].n:sort[0]==='site'?ST[x.site].name:sort[0]==='depth'?x.depth[1]:x[sort[0]];return(g(a)>g(b)?1:-1)*sort[1]});return f.map(r=>`<tr data-r="${r.id}" style="cursor:pointer"><td class="mu">${r.id}</td><td><i>${SC[r.sp].n}</i></td><td>${ST[r.site]?.name||r.site}<div class="mu" style="font-size:11px">${tv('gov',gv(r))}</div></td><td>${nf(r.date)}</td><td>${tv('basis',r.basis)}</td><td><span class="tag ${r.status==='Verified'?'ok':r.status==='Flagged'?'cr':'wn'}">${tv('status',r.status)}</span></td><td>${r.dna?'🧬':''}</td></tr>`).join('')||'<tr><td class="mu">—</td></tr>'};
function rec(v){const govs=[...new Set(D.sites.map(s=>s.gov))],sts=[...new Set(R.map(r=>r.status))];
v.innerHTML=head(t('rec'),`<button class="chip" id="ex">⬇ ${t('export')}</button>`)+`<div class="chips"><select id="fs"><option value="">${t('species')}: ${t('all')}</option>${SP.map(s=>`<option value="${s.code}" ${F.sp===s.code?'selected':''}>L. ${s.epithet}</option>`).join('')}</select><select id="fg"><option value="">${t('gov').split(' ')[0]}: ${t('all')}</option>${govs.map(g=>`<option value="${g}" ${F.gov===g?'selected':''}>${tv('gov',g)}</option>`).join('')}</select><select id="ft"><option value="">${t('status')}: ${t('all')}</option>${sts.map(g=>`<option value="${g}" ${F.st===g?'selected':''}>${tv('status',g)}</option>`).join('')}</select><button class="chip" id="rs">${t('clear')}</button></div><div class="card sc"><table><thead><tr>${[['id',t('id')],['sp',t('species')],['site',t('site')],['date',t('date')],['basis',t('basis')],['status',t('status')],['dna',t('dna')]].map(([k,l])=>`<th data-k="${k}">${l}${sort[0]===k?(sort[1]>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody id="tb">${rows()}</tbody></table></div>`;
[['fs','sp'],['fg','gov'],['ft','st']].forEach(([i,k])=>$('#'+i).onchange=e=>{F[k]=e.target.value;renderBody()});$('#rs').onclick=()=>{F={sp:'',gov:'',st:'',q:''};render()};
v.querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;sort=[k,sort[0]===k?-sort[1]:1];rec(v)});$('#tb').onclick=e=>{const tr=e.target.closest('tr');if(tr?.dataset.r)recDrawer(tr.dataset.r)};
$('#ex').onclick=()=>{const f=filt(),csv='id,species,site,governorate,date,basis,status,lat,lon,depth_min,depth_max,dna\n'+f.map(r=>[r.id,SC[r.sp].full,ST[r.site]?.name,gv(r),r.date,r.basis,r.status,r.lat,r.lon,r.depth[0],r.depth[1],r.dna].join(',')).join('\n');const a=h('a',{href:URL.createObjectURL(new Blob([csv],{type:'text/csv'})),download:'seaweed_records.csv'});a.click()}}
function recDrawer(id){const r=R.find(x=>x.id===id),s=SC[r.sp],st=ST[r.site]||{},q=D.seqs.filter(x=>x.rec===r.id||x.rec===id);$('#dr').innerHTML=`<div class="dr"><button class="x">✕</button><h1>${r.id}</h1><div><i>${s.full}</i></div><dl class="kv"><dt>${t('site')}</dt><dd>${st.name||r.site} · ${tv('gov',st.gov)}</dd><dt>${t('coast')}</dt><dd>${tv('coast',st.coast)}</dd><dt>${t('loc')}</dt><dd>${r.lat}, ${r.lon}</dd><dt>${t('unc')}</dt><dd>${nf(r.unc)}</dd><dt>${t('date')}</dt><dd>${r.date}</dd><dt>${t('depth')}</dt><dd>${r.depth.join('–')}</dd><dt>${t('hab')}</dt><dd>${tv('hab',r.habitat)}</dd><dt>${t('sub_')}</dt><dd>${r.substrate}</dd><dt>${t('rep')}</dt><dd>${r.repro}</dd><dt>${t('basis')}</dt><dd>${tv('basis',r.basis)}</dd><dt>${t('status')}</dt><dd>${tv('status',r.status)}</dd><dt>${t('rb')}</dt><dd>${r.recordedBy}</dd><dt>${t('photos')}</dt><dd>${nf(r.photos)}</dd></dl>${q.map(x=>`<h2>${x.marker} · ${x.len} bp · ${x.quality}</h2><div class="seq">${x.seq}</div>`).join('')}</div>`;$('#dr .x').onclick=()=>$('#dr').innerHTML=''}
function gen(v){const e=D.extraction;v.innerHTML=head(t('gen'))+`<div class="grid g2"><div class="card sc"><h2>${t('gap')}</h2><table><tr><th>${t('species')}</th><th>${t('n')}</th><th>${t('intra')}</th><th>${t('nn')}</th><th>${t('dist')}</th></tr>${D.gap.map(g=>{const ok=g.nnDist>g.intraMax;return `<tr><td><i>${SC[g.sp].n}</i></td><td>${nf(g.n)}</td><td>${nf(g.intraMax)}</td><td><i>${SC[g.nn].n}</i></td><td><span class="tag ${ok?'ok':'cr'}">${nf(g.nnDist)}</span></td></tr>`}).join('')}</table></div><div class="card"><h2>${t('ext')}</h2>${e.map(x=>`<div style="margin:8px 0">${x.method}<div class="bar"><span class="tr"><i style="width:${x.pcrOk/x.n*100}%;background:var(--c3)"></i></span><em>${nf(x.pcrOk)}/${nf(x.n)}</em></div><div class="mu" style="font-size:12px">${t('yield')}: ${x.yield_} · A260/280 ${x.a260}</div></div>`).join('')}</div><div class="card sc" style="grid-column:1/-1"><h2>${t('seqs')}</h2><table><tr><th>${t('id')}</th><th>${t('species')}</th><th>Marker</th><th>bp</th><th>${t('status')}</th></tr>${D.seqs.map(q=>`<tr><td class="mu">${q.id}</td><td><i>${SC[q.sp].n}</i></td><td>${q.marker}</td><td>${nf(q.len)}</td><td>${q.status}</td></tr>`).join('')}</table></div></div>`}
function chem(v){const a=SP.map(s=>[s.code,s.chem.length,SC[s.code].n,col(SC[s.code].i)]).sort((a,b)=>b[1]-a[1]),all=SP.flatMap(s=>s.chem.map(c=>({...c,sp:s.code})));v.innerHTML=head(t('chem'))+`<div class="grid g2"><div class="card"><h2>${t('cs')}</h2>${bars(a)}</div><div class="card sc"><table><tr><th>${t('cmp')}</th><th>${t('cls')}</th><th>${t('act')}</th><th>${t('meth')}</th><th>${t('species')}</th></tr>${all.map(c=>`<tr><td><b>${c.name}</b></td><td>${c.cls}</td><td>${c.activity}</td><td>${c.method}</td><td><i>${SC[c.sp].n}</i></td></tr>`).join('')}</table></div></div>`}
/* chatbot: local, bilingual, covers all dataset parameters */
const AR={'ظفار':'Dhofar','مسقط':'Muscat','مسندم':'Musandam','الوسطى':'Al Wusta','الشرقية':'South Al Sharqiyah','الباطنة':'Batinah'},KW={dna:/dna|barcode|rbcl|coi|sequence|حمض|باركود|جين|تسلسل/i,chem:/compound|chem|activity|bioactiv|مركب|كيمي|نشاط/i,depth:/depth|deep|عمق|أعمق/i,status:/status|verif|flag|حالة|تحقق/i,count:/how many|count|number|total|كم|عدد/i,gap:/gap|distance|فجوة/i,site:/site|location|where|موقع|مواقع|أين/i,year:/year|سنة|عام/i,hab:/habitat|substrate|موئل|ركيزة/i,repro:/repro|fertile|sterile|تكاثر/i,list:/species|types|أنواع|نوع/i,ext:/extract|ctab|pcr|استخلاص/i};
function ans(q){const A=L==='ar',lq=q.toLowerCase(),sp=SP.find(s=>lq.includes(s.epithet.toLowerCase())||lq.includes(s.code.toLowerCase())||lq.includes(s.epithet.slice(0,5).toLowerCase())),gov=Object.entries(AR).find(([k])=>q.includes(k))?.[1]||D.sites.map(s=>s.gov).find(g=>lq.includes(g.toLowerCase())||lq.includes(g.split(' ').pop().toLowerCase())),yr=(q.match(/20\d\d/)||[])[0];
let rs=R.filter(r=>(!sp||r.sp===sp.code)&&(!gov||gv(r).includes(gov))&&(!yr||r.date.startsWith(yr)));const sn=sp?'L. '+sp.epithet:'';
if(KW.chem.test(q)){const l=(sp?[sp]:SP).flatMap(s=>s.chem.map(c=>`• ${c.name} (${c.cls}) — ${c.activity}${sp?'':' ['+SC[s.code].n+']'}`));return (A?`المركبات${sn?' في '+sn:''}:\n`:`Compounds${sn?' in '+sn:''}:\n`)+l.slice(0,10).join('\n')}
if(KW.gap.test(q)){return D.gap.map(g=>`${SC[g.sp].n}: ${A?'تباين داخلي':'intra max'} ${g.intraMax}% · ${A?'أقرب':'nearest'} ${SC[g.nn].n} ${g.nnDist}%`).join('\n')}
if(KW.ext.test(q)){return D.extraction.map(x=>`${x.method}: PCR ${x.pcrOk}/${x.n}, ${A?'الكمية':'yield'} ${x.yield_}`).join('\n')}
if(KW.dna.test(q)){const c=cnt(D.seqs,x=>x.sp).filter(([k])=>!sp||k===sp.code);return (A?`تسلسلات الباركود (${D.seqs.length}):\n`:`DNA barcodes (${D.seqs.length} sequences):\n`)+c.map(([k,v])=>`• ${SC[k].n}: ${v} (${D.seqs.find(x=>x.sp===k).marker})`).join('\n')}
if(KW.depth.test(q)){const d=[...rs].sort((a,b)=>b.depth[1]-a.depth[1])[0];return d?`${A?'أعمق سجل':'Deepest record'}: ${d.id} · ${SC[d.sp].n} · ${d.depth[1]} m · ${ST[d.site]?.name}`:'—'}
if(KW.status.test(q)){return cnt(rs,r=>r.status).map(([k,v])=>`• ${tv('status',k)}: ${v}`).join('\n')}
if(KW.hab.test(q)){return cnt(rs,r=>r.habitat).map(([k,v])=>`• ${tv('hab',k)}: ${v}`).join('\n')}
if(KW.repro.test(q)){return cnt(rs,r=>r.repro).map(([k,v])=>`• ${k}: ${v}`).join('\n')}
if(KW.year.test(q)&&!yr){return cnt(rs,r=>r.date.slice(0,4)).sort().map(([k,v])=>`${k}: ${v}`).join(' · ')}
if(KW.site.test(q)||gov){const s=D.sites.filter(x=>!gov||x.gov.includes(gov));return (A?`${s.length} موقع`:`${s.length} sites`)+(gov?` (${tv('gov',gov)})`:'')+`: `+s.map(x=>x.name).join(', ')+`\n${rs.length} ${A?'سجل':'records'}`}
if(sp&&!KW.count.test(q)){const o=sp;return `${SC[o.code].full} ${o.authority} ${o.year}\n${o.statusLabel}\n${t('habit')}: ${o.habit}\n${t('height')}: ${o.height.join('–')}\n${t('hab')}: ${o.habitat}\n${rs.length} ${A?'سجل':'records'}`}
if(KW.count.test(q)||yr){return `${rs.length} ${A?'سجل':'records'}${sn?' · '+sn:''}${yr?' · '+yr:''}`}
if(KW.list.test(q)){return SP.map(s=>`• ${SC[s.code].full} — ${s.statusLabel}`).join('\n')}
return t('nores')}
function chatInit(re){const c=$('#chat');if(re&&c.dataset.open!=='1'){c.innerHTML='<button class="fab" aria-label="chat">💬</button>';c.firstChild.onclick=()=>{c.dataset.open='1';chatInit(true)};return}
c.dataset.open='1';c.innerHTML=`<div class="cb"><div class="cbh"><span>🌿 ${t('chat')}</span><button aria-label="close">✕</button></div><div class="msgs" id="ms"></div><div class="sg">${t('try').map(x=>`<button>${x}</button>`).join('')}</div><form class="cin" onsubmit="return false"><input id="ci" placeholder="${t('ph')}" autocomplete="off"><button>➤</button></form></div>`;const ms=$('#ms'),add=(x,u)=>{ms.append(h('div',{className:'m'+(u?' u':''),textContent:x}));ms.scrollTop=1e9},go=q=>{if(!q.trim())return;add(q,1);setTimeout(()=>add(ans(q)),250)};add(t('hi'));
c.querySelector('.cbh button').onclick=()=>{c.dataset.open='0';chatInit(true)};c.querySelectorAll('.sg button').forEach(b=>b.onclick=()=>go(b.textContent));c.querySelector('form').onsubmit=e=>{e.preventDefault();const i=$('#ci');go(i.value);i.value='';return false}}
setLang(L);
